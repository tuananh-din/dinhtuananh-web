---
deployment:
  tasks:
    - export DEPLOYPATH=/home/dinhtuan1/public_html
    - /bin/cp -R app "$DEPLOYPATH/"
    - /bin/cp -R bootstrap "$DEPLOYPATH/"
    - /bin/cp -R config "$DEPLOYPATH/"
    - /bin/cp -R database "$DEPLOYPATH/"
    - /bin/cp -R resources "$DEPLOYPATH/"
    - /bin/cp -R routes "$DEPLOYPATH/"
    - /bin/cp -R public/app "$DEPLOYPATH/public/"
    - /bin/cp -R public/site "$DEPLOYPATH/public/"
    - /bin/cp public/index.php "$DEPLOYPATH/public/"
    - /bin/cp public/.htaccess "$DEPLOYPATH/public/"
    - /bin/cp artisan composer.json composer.lock "$DEPLOYPATH/"
    - cd "$DEPLOYPATH" && /usr/local/bin/php artisan migrate --force
    - cd "$DEPLOYPATH" && /usr/local/bin/php artisan config:clear
    - cd "$DEPLOYPATH" && /usr/local/bin/php artisan view:clear
